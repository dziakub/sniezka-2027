function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function zapisz(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function czytaj(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function otworz(pw,cicho){
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(DATA));
    zapisz('snHaslo',pw);
    if(location.hash.indexOf('#k=')===0){history.replaceState(null,'',location.pathname);}
    document.open();document.write(new TextDecoder().decode(plain));document.close();
  }catch(e){
    zapisz('snHaslo',null);
    if(!cicho)document.getElementById('err').textContent='Hasło się nie zgadza.';
